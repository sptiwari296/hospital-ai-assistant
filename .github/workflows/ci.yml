# Continuous integration: every push / pull request must pass the full test suite
# (including the 160-case release gate), the frontend checks, and both image builds.
name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: hospital
          POSTGRES_USER: hospital_app
          POSTGRES_PASSWORD: ci_admin_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hospital_app -d hospital" --health-interval 5s --health-retries 20
    env:
      POSTGRES_DB: hospital
      POSTGRES_USER: hospital_app
      POSTGRES_PASSWORD: ci_admin_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      HOSPITAL_TIMEZONE: Asia/Kolkata
      PGPASSWORD: ci_admin_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt
      - name: Generate throw-away CI secrets
        run: |
          python - >> "$GITHUB_ENV" <<'EOF'
          import secrets
          from cryptography.fernet import Fernet
          print(f"JWT_SECRET={secrets.token_urlsafe(48)}")
          print(f"DEMO_PASSWORD=Ci-{secrets.token_urlsafe(9)}")
          print(f"API_DB_PASSWORD={secrets.token_urlsafe(24)}")
          print(f"FIELD_ENCRYPTION_KEY={Fernet.generate_key().decode()}")
          EOF
      - name: Create schema (same scripts as docker-entrypoint-initdb.d)
        run: |
          sudo apt-get install -y -q postgresql-client
          psql -h localhost -U hospital_app -d hospital -c "ALTER DATABASE hospital SET timezone TO 'Asia/Kolkata'"
          for f in backend/database/init/*.sql; do psql -h localhost -U hospital_app -d hospital -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Security setup, demo users, knowledge-base ingestion
        run: |
          python scripts/setup_security.py
          python scripts/set_demo_passwords.py
          python scripts/ingest_kb.py
      - name: Tests (unit, integration, security, release gate)
        run: python -m pytest -q
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: evaluation-report, path: data/evaluation_dataset/reports/latest-oracle.md}

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/api.Dockerfile -t hospital-api:ci .
      - run: docker build -f docker/frontend.Dockerfile -t hospital-web:ci frontend
